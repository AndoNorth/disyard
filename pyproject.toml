[project]
name = "weft"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

# Workspace members are installed through the dev group, because a plain `uv run` installs only the root project.
[tool.uv.sources]
wft-acceptance = { workspace = true }
wft-admission = { workspace = true }
wft-aggregate = { workspace = true }
wft-artifactclient = { workspace = true }
wft-artifactindex = { workspace = true }
wft-artifactreaper = { workspace = true }
wft-broker = { workspace = true }
wft-clusterkit = { workspace = true }
wft-compat = { workspace = true }
wft-compile = { workspace = true }
wft-dispatchapi = { workspace = true }
wft-events = { workspace = true }
wft-eventstore = { workspace = true }
wft-itest = { workspace = true }
wft-jobcheck = { workspace = true }
wft-jobdoc = { workspace = true }
wft-jobexamples = { workspace = true }
wft-jobpatch = { workspace = true }
wft-jobstate = { workspace = true }
wft-jobtools = { workspace = true }
wft-kernel = { workspace = true }
wft-keys = { workspace = true }
wft-migrate = { workspace = true }
wft-placement = { workspace = true }
wft-plan = { workspace = true }
wft-runtime = { workspace = true }
wft-stages = { workspace = true }
wft-stateops = { workspace = true }
wft-storecheck = { workspace = true }
wft-temporal = { workspace = true }
wft-worker = { workspace = true }
wft-workflow = { workspace = true }
wft-workloads = { workspace = true }

[dependency-groups]
dev = [
    "hypothesis",
    "pytest",
    "wft-acceptance",
    "wft-admission",
    "wft-aggregate",
    "wft-artifactclient",
    "wft-artifactindex",
    "wft-artifactreaper",
    "wft-broker",
    "wft-clusterkit",
    "wft-compat",
    "wft-compile",
    "wft-dispatchapi",
    "wft-events",
    "wft-eventstore",
    "wft-itest",
    "wft-jobcheck",
    "wft-jobdoc",
    "wft-jobexamples",
    "wft-jobpatch",
    "wft-jobstate",
    "wft-jobtools",
    "wft-kernel",
    "wft-keys",
    "wft-migrate",
    "wft-placement",
    "wft-plan",
    "wft-runtime",
    "wft-stages",
    "wft-stateops",
    "wft-storecheck",
    "wft-temporal",
    "wft-worker",
    "wft-workflow",
    "wft-workloads",
]

[tool.pytest.ini_options]
# Several packages have a tests/test_vectors.py, so test modules are imported by path and not by basename.
addopts = "--import-mode=importlib"
markers = [
    "integration: needs containers started through wft_itest",
    "slow: large results, deselected by scripts/test.sh and run only when selected",
]
