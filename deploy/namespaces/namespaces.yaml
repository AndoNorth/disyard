# Namespaces and LimitRanges of the topology contract. The ResourceQuotas are rendered from the preset by
# scripts/cluster/namespaces.sh, because their numbers follow the node sizes.
apiVersion: v1
kind: Namespace
metadata:
  name: dsy-infra
  labels:
    dsy.dev/group: infra
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: dsy-infra
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 100m
        memory: 128Mi
---
