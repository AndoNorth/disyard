name: compile-worker
group: workers
namespace: wft-workers
artifact:
  kind: image
  pin: python
# One pod slot of deploy/presets/slots/ci.yaml, so requests equal limits.
resources:
  compile-worker:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
readiness:
  command:
    - kubectl
    - --context=kind-wft
    - --namespace=wft-workers
    - wait
    - --for=condition=Available
    - deployment/compile-worker
    - --timeout=300s
profiles: [ci]
depends_on:
  - infra/temporal-bootstrap
  - infra/objectstore-bootstrap
  - infra/mirror
