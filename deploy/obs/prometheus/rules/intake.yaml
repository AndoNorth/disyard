groups:
  - name: wft-intake
    rules:
      - alert: WftDeadLetterQueueNotEmpty
        expr: rabbitmq_detailed_queue_messages_ready{queue="intake.dlq"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The intake dead-letter queue holds {{ $value }} message(s).
          description: Every dead letter needs a recovery decision, replay or purge.
      - alert: WftIntakeQueueStalled
        expr: |
          rabbitmq_detailed_queue_messages_ready{queue=~"intake\\..+", queue!="intake.dlq"} > 0
          and
          rabbitmq_detailed_queue_consumers{queue=~"intake\\..+", queue!="intake.dlq"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Intake queue {{ $labels.queue }} has ready messages and no consumer.
          description: Nothing admits the jobs of this queue.
      - alert: WftIntakePublishUnroutable
        expr: sum(increase(wft_broker_publish_total{outcome="unroutable"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: The broker client published messages the exchange could not route.
          description: The topology differs from the tenancy profile of the publisher.
      - alert: WftIntakeWaitHigh
        expr: |
          histogram_quantile(0.95, sum by (priority_class, le)
            (rate(wft_admission_wait_seconds_bucket[15m]))) > 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Jobs of class {{ $labels.priority_class }} wait over an hour to be admitted (p95).
          description: The wait from acceptance to admission is above the estimate of one hour.
