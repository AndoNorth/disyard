groups:
  - name: dsy-intake
    rules:
      - alert: DsyDeadLetterQueueNotEmpty
        expr: rabbitmq_detailed_queue_messages_ready{queue="intake.dlq"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The intake dead-letter queue holds {{ $value }} message(s).
          description: Every dead letter needs a recovery decision, replay or purge.
          runbook_url: https://github.com/AndoNorth/disyard/blob/main/docs/runbooks/alerts.md#dsydeadletterqueuenotempty
      - alert: DsyIntakeQueueStalled
        expr: |
          rabbitmq_detailed_queue_messages_ready{queue=~"intake\\..+", queue!="intake.dlq"} > 0
          and
          rabbitmq_detailed_queue_consumers{queue=~"intake\\..+", queue!="intake.dlq"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Intake queue {{ $labels.queue }} has ready messages and no consumer.
          description: Nothing admits the jobs of this queue.
          runbook_url: https://github.com/AndoNorth/disyard/blob/main/docs/runbooks/alerts.md#dsyintakequeuestalled
      - alert: DsyIntakePublishUnroutable
        expr: sum(increase(dsy_broker_publish_total{outcome="unroutable"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: The broker client published messages the exchange could not route.
          description: The topology differs from the tenancy profile of the publisher.
          runbook_url: https://github.com/AndoNorth/disyard/blob/main/docs/runbooks/alerts.md#dsyintakepublishunroutable
      - alert: DsyIntakeWaitHigh
        expr: |
          histogram_quantile(0.95, sum by (priority_class, le)
            (rate(dsy_admission_wait_seconds_bucket[15m]))) > 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Jobs of class {{ $labels.priority_class }} wait over an hour to be admitted (p95).
          description: The wait from acceptance to admission is above the estimate of one hour.
          runbook_url: https://github.com/AndoNorth/disyard/blob/main/docs/runbooks/alerts.md#dsyintakewaithigh
