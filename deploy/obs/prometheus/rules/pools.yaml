groups:
  - name: wft-pools
    rules:
      - alert: WftPoolBacklogAgeHigh
        expr: max by (taskqueue) (approximate_backlog_age_seconds{task_type="Activity"}) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The oldest task on Temporal queue {{ $labels.taskqueue }} has waited {{ $value | humanizeDuration }}.
          description: >-
            The pool is not keeping up with its queue. The server spells the queue with underscores in
            place of dashes.
          runbook_url: https://github.com/AndoNorth/weft/blob/main/docs/runbooks/alerts.md#wftpoolbacklogagehigh
      - alert: WftUnschedulableTasks
        expr: sum by (pool) (increase(wft_placement_decisions_total{verdict="unschedulable"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Placement found no slot for tasks of pool {{ $labels.pool }}.
          description: A task needs more than any slot of its pool offers.
          runbook_url: https://github.com/AndoNorth/weft/blob/main/docs/runbooks/alerts.md#wftunschedulabletasks
      - alert: WftHeartbeatTimeoutStorm
        expr: sum by (taskqueue) (increase(activity_task_timeout{timeout_type="Heartbeat"}[15m])) > 5
        labels:
          severity: critical
        annotations:
          summary: >-
            More than 5 attempts on Temporal queue {{ $labels.taskqueue }} timed out waiting for a
            heartbeat in 15 minutes.
          description: Workers on the queue are stalled or lost, and the attempts are retried.
          runbook_url: https://github.com/AndoNorth/weft/blob/main/docs/runbooks/alerts.md#wftheartbeattimeoutstorm
      - alert: WftPoolSaturated
        expr: |
          sum by (task_queue) (temporal_worker_task_slots_used{worker_type="ActivityWorker"})
          / sum by (task_queue) (
              temporal_worker_task_slots_used{worker_type="ActivityWorker"}
              + temporal_worker_task_slots_available{worker_type="ActivityWorker"}
            ) >= 1
        for: 30m
        labels:
          severity: info
        annotations:
          summary: Every activity slot of queue {{ $labels.task_queue }} has been busy for 30 minutes.
          description: >-
            The pool runs at full width, which is expected under load and worth knowing when its backlog
            grows.
          runbook_url: https://github.com/AndoNorth/weft/blob/main/docs/runbooks/alerts.md#wftpoolsaturated
