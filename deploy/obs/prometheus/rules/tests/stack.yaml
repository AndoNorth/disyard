rule_files:
  - ../stack.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    name: obs data loss fires for dropped logs and spans and stays silent when flat
    input_series:
      - series: 'wft_obs_log_dropped_total{component="dispatch"}'
        values: '0 0 5 5 5'
      - series: 'wft_obs_span_dropped_total{component="workflow"}'
        values: '0 0 0 2 2'
      - series: 'wft_obs_log_dropped_total{component="admission"}'
        values: '7x4'
      - series: 'wft_obs_span_dropped_total{component="admission"}'
        values: '7x4'
    alert_rule_test:
      - eval_time: 4m
        alertname: WftObsDataLoss
        exp_alerts:
          - exp_labels: {severity: warning, component: dispatch}
            exp_annotations:
              runbook_url: >-
                https://github.com/AndoNorth/weft/blob/main/docs/runbooks/alerts.md#wftobsdataloss
              summary: Component dispatch dropped log records or spans from a full export queue.
              description: The collector or a backend behind it is not keeping up, and the missing telemetry is gone.
          - exp_labels: {severity: warning, component: workflow}
            exp_annotations:
              runbook_url: >-
                https://github.com/AndoNorth/weft/blob/main/docs/runbooks/alerts.md#wftobsdataloss
              summary: Component workflow dropped log records or spans from a full export queue.
              description: The collector or a backend behind it is not keeping up, and the missing telemetry is gone.
      - eval_time: 30m
        alertname: WftObsDataLoss
        exp_alerts: []
  - interval: 1m
    name: obs volume filling fires for prometheus and tempo above their caps
    input_series:
      - series: 'prometheus_tsdb_storage_blocks_bytes'
        values: '4e9x30'
      - series: 'prometheus_tsdb_wal_storage_size_bytes'
        values: '4e8x30'
      - series: 'prometheus_tsdb_head_chunks_storage_size_bytes'
        values: '2e8x30'
      - series: 'tempodb_backend_bytes_total{status="live",tenant="single-tenant"}'
        values: '2.5e9x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WftObsVolumeFilling
        exp_alerts:
          - exp_labels: {severity: warning, backend: prometheus}
            exp_annotations:
              runbook_url: >-
                https://github.com/AndoNorth/weft/blob/main/docs/runbooks/alerts.md#wftobsvolumefilling
              summary: The prometheus volume holds more than its size cap.
              description: >-
                Prometheus and Tempo read their stored bytes, and Loki the chunk bytes written in its 10 days
                of retention. Loki and Tempo have no size key, so this alert is their only brake on a flood.
          - exp_labels: {severity: warning, backend: tempo}
            exp_annotations:
              runbook_url: >-
                https://github.com/AndoNorth/weft/blob/main/docs/runbooks/alerts.md#wftobsvolumefilling
              summary: The tempo volume holds more than its size cap.
              description: >-
                Prometheus and Tempo read their stored bytes, and Loki the chunk bytes written in its 10 days
                of retention. Loki and Tempo have no size key, so this alert is their only brake on a flood.
  - interval: 1h
    name: obs volume filling fires for loki above 8 GB written in its retention
    input_series:
      - series: 'loki_ingester_chunk_size_bytes_sum'
        values: '0+4e7x300'
    alert_rule_test:
      - eval_time: 260h
        alertname: WftObsVolumeFilling
        exp_alerts:
          - exp_labels: {severity: warning, backend: loki}
            exp_annotations:
              runbook_url: >-
                https://github.com/AndoNorth/weft/blob/main/docs/runbooks/alerts.md#wftobsvolumefilling
              summary: The loki volume holds more than its size cap.
              description: >-
                Prometheus and Tempo read their stored bytes, and Loki the chunk bytes written in its 10 days
                of retention. Loki and Tempo have no size key, so this alert is their only brake on a flood.
  - interval: 1m
    name: obs volume filling stays silent below the caps and for tempo series that are not live bytes
    input_series:
      - series: 'prometheus_tsdb_storage_blocks_bytes'
        values: '3e9x30'
      - series: 'prometheus_tsdb_wal_storage_size_bytes'
        values: '4e8x30'
      - series: 'prometheus_tsdb_head_chunks_storage_size_bytes'
        values: '2e8x30'
      - series: 'tempodb_backend_bytes_total{status="live",tenant="single-tenant"}'
        values: '1.7e9x30'
      - series: 'tempodb_backend_bytes_total{status="compacted",tenant="single-tenant"}'
        values: '5e9x30'
      - series: 'loki_ingester_chunk_size_bytes_sum'
        values: '0+1e3x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: WftObsVolumeFilling
        exp_alerts: []
  - interval: 1m
    name: obs volume filling stays silent for a spike shorter than 15 minutes
    input_series:
      - series: 'tempodb_backend_bytes_total{status="live",tenant="single-tenant"}'
        values: '1e9x5 2.5e9x5 1e9x20'
    alert_rule_test:
      - eval_time: 25m
        alertname: WftObsVolumeFilling
        exp_alerts: []
  - interval: 1h
    name: obs volume filling stays silent for loki at its measured growth
    input_series:
      - series: 'loki_ingester_chunk_size_bytes_sum'
        values: '0+5e6x300'
    alert_rule_test:
      - eval_time: 260h
        alertname: WftObsVolumeFilling
        exp_alerts: []
