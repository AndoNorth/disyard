rule_files:
  - ../intake.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    name: dead letter queue fires after 5 minutes of a ready message
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="intake.dlq"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: DsyDeadLetterQueueNotEmpty
        exp_alerts: []
      - eval_time: 6m
        alertname: DsyDeadLetterQueueNotEmpty
        exp_alerts:
          - exp_labels: {severity: critical, queue: intake.dlq}
            exp_annotations:
              runbook_url: >-
                https://github.com/AndoNorth/disyard/blob/main/docs/runbooks/alerts.md#dsydeadletterqueuenotempty
              summary: The intake dead-letter queue holds 1 message(s).
              description: Every dead letter needs a recovery decision, replay or purge.
  - interval: 1m
    name: dead letter queue stays silent when empty
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="intake.dlq"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: DsyDeadLetterQueueNotEmpty
        exp_alerts: []
  - interval: 1m
    name: stalled fires for a queue with messages and no consumer
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="intake.acme.standard"}'
        values: '5x15'
      - series: 'rabbitmq_detailed_queue_consumers{queue="intake.acme.standard"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: DsyIntakeQueueStalled
        exp_alerts:
          - exp_labels: {severity: critical, queue: intake.acme.standard}
            exp_annotations:
              runbook_url: >-
                https://github.com/AndoNorth/disyard/blob/main/docs/runbooks/alerts.md#dsyintakequeuestalled
              summary: Intake queue intake.acme.standard has ready messages and no consumer.
              description: Nothing admits the jobs of this queue.
  - interval: 1m
    name: stalled stays silent with a consumer, with no messages and for the dead-letter queue
    input_series:
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="intake.acme.standard"}'
        values: '5x15'
      - series: 'rabbitmq_detailed_queue_consumers{queue="intake.acme.standard"}'
        values: '1x15'
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="intake.acme.bulk"}'
        values: '0x15'
      - series: 'rabbitmq_detailed_queue_consumers{queue="intake.acme.bulk"}'
        values: '0x15'
      - series: 'rabbitmq_detailed_queue_messages_ready{queue="intake.dlq"}'
        values: '5x15'
      - series: 'rabbitmq_detailed_queue_consumers{queue="intake.dlq"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 14m
        alertname: DsyIntakeQueueStalled
        exp_alerts: []
  - interval: 1m
    name: unroutable fires while the counter keeps rising
    input_series:
      - series: 'dsy_broker_publish_total{outcome="unroutable"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: DsyIntakePublishUnroutable
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              runbook_url: >-
                https://github.com/AndoNorth/disyard/blob/main/docs/runbooks/alerts.md#dsyintakepublishunroutable
              summary: The broker client published messages the exchange could not route.
              description: The topology differs from the tenancy profile of the publisher.
  - interval: 1m
    name: unroutable stays silent for rejected publishes and a flat counter
    input_series:
      - series: 'dsy_broker_publish_total{outcome="rejected"}'
        values: '0+10x30'
      - series: 'dsy_broker_publish_total{outcome="unroutable"}'
        values: '3x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: DsyIntakePublishUnroutable
        exp_alerts: []
  - interval: 1m
    name: intake wait fires when the p95 wait is above an hour
    input_series:
      - series: 'dsy_admission_wait_seconds_bucket{priority_class="standard",le="900"}'
        values: '0x60'
      - series: 'dsy_admission_wait_seconds_bucket{priority_class="standard",le="3600"}'
        values: '0x60'
      - series: 'dsy_admission_wait_seconds_bucket{priority_class="standard",le="14400"}'
        values: '0+10x60'
      - series: 'dsy_admission_wait_seconds_bucket{priority_class="standard",le="+Inf"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: DsyIntakeWaitHigh
        exp_alerts:
          - exp_labels: {severity: warning, priority_class: standard}
            exp_annotations:
              runbook_url: >-
                https://github.com/AndoNorth/disyard/blob/main/docs/runbooks/alerts.md#dsyintakewaithigh
              summary: Jobs of class standard wait over an hour to be admitted (p95).
              description: The wait from acceptance to admission is above the estimate of one hour.
  - interval: 1m
    name: intake wait stays silent when jobs are admitted in seconds
    input_series:
      - series: 'dsy_admission_wait_seconds_bucket{priority_class="standard",le="5"}'
        values: '0+10x60'
      - series: 'dsy_admission_wait_seconds_bucket{priority_class="standard",le="3600"}'
        values: '0+10x60'
      - series: 'dsy_admission_wait_seconds_bucket{priority_class="standard",le="+Inf"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 55m
        alertname: DsyIntakeWaitHigh
        exp_alerts: []
