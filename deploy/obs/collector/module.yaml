name: collector
group: obs
namespace: wft-obs
artifact:
  kind: image
  pin: otel/opentelemetry-collector-contrib
resources:
  collector:
    requests:
      cpu: 50m
      memory: 160Mi
    limits:
      cpu: 50m
      memory: 160Mi
readiness:
  resource: deployment/collector
  condition: Available
profiles: [ci]
