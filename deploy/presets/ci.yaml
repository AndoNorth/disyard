# A GitHub runner, with a total about 11.8 GiB.
# Node sizes are hard container limits, and a node never exceeds its size.
# Figures follow docs/delivery/spikes/S2/footprint.md: a pool node fits one pod slot of deploy/presets/slots plus the
# daemons of the node, and the infra node fits its quota. Worker pool sizes are provisional estimates until real
# components are characterized, and the control plane size is a computed figure, not a measured one.
# obs_stack is the obs node with the observability switch on, the whole stack, sized by the footprint spike S13.
name: ci
fitted: true
memory_mib: 12032
cpus: 8
nodes:
  - role: control-plane
    count: 1
    cpus: 1
    memory_mib: 1280
  - role: infra
    count: 1
    cpus: 3
    memory_mib: 6144
  - role: obs
    count: 1
    cpus: 0.5
    memory_mib: 640
  - role: compile
    count: 1
    cpus: 1.5
    memory_mib: 1536
  - role: simulate
    count: 1
    cpus: 0.5
    memory_mib: 896
  - role: aggregate
    count: 1
    cpus: 1.5
    memory_mib: 1536
obs_stack:
  cpus: 1.5
  memory_mib: 4096
obs_memory_mib: 15488
host:
  ports: deploy/host/ports.yaml
  data_dir: ~/.local/share/dsy/ci
mirror: true
