name: scan

on:
  push:
    branches: [main]
  pull_request:
  # New advisories land without a commit, so main is scanned again every week.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  # Findings of high and critical severity fail a job. scripts/scan.sh and security/ say how, and where an accepted
  # finding is recorded.
  secrets:
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      # The scan reads the whole history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix develop -c just scan secrets

  deps:
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix develop -c just scan deps

  images:
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Restore the build download cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/disyard/build
          key: build-downloads-${{ hashFiles('uv.lock', 'nix/wasm-tools.nix', 'deploy/versions.yaml') }}
          restore-keys: build-downloads-
      - run: nix develop -c just scan images
