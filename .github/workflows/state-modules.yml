name: state-modules

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - deploy/appdb/**
      - deploy/temporaldb/**
      - deploy/objectstore/**
      - contracts/store/**
      - contracts/state/**
      - packages/storecheck/**
      - packages/migrate/**
      - scripts/storage/**
      - .github/workflows/state-modules.yml

permissions:
  contents: read

jobs:
  # Setting the repository variable CI_ENABLED to false skips this job.
  # A commit message containing [skip ci] also skips runs natively.
  state-modules:
    if: ${{ vars.CI_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WFT_PRESET: ci
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # The image builds of the Tilt run read their wheels and release assets from this cache first.
      - name: Restore the build download cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/wasm-dag-forge/build
          key: build-downloads-${{ hashFiles('uv.lock', 'nix/wasm-tools.nix', 'deploy/versions.yaml') }}
          restore-keys: build-downloads-
      # The six kind nodes need more inotify instances than the kernel default of 128.
      # The runner image writes higher limits to /etc/sysctl.conf, which Ubuntu 26.04 no longer loads at boot.
      - name: Raise inotify limits
        run: |
          sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches
          sudo sysctl -w fs.inotify.max_user_instances=1280 fs.inotify.max_user_watches=655360
      - run: nix develop -c just up
      - run: nix develop -c scripts/tilt/run.sh ci
      - name: Store contract script
        shell: nix develop -c bash -euo pipefail {0}
        run: |
          kubectl --context kind-wft -n wft-infra port-forward --address 127.0.0.1 svc/objectstore 18333:8333 &
          forward=$!
          trap 'kill "$forward"' EXIT
          for _ in $(seq 60); do
            (exec 3<>/dev/tcp/127.0.0.1/18333) 2>/dev/null && break
            sleep 1
          done
          credentials=$(scripts/storage/store/identities.sh path)
          for mode in base access; do
            uv run --frozen python -m wft_storecheck run --endpoint http://127.0.0.1:18333 \
              --credentials "$credentials" --mode "$mode"
          done
      - name: Migration check
        run: nix develop -c scripts/storage/db/migrate.sh check
      - name: Export cluster logs
        if: ${{ failure() }}
        run: nix develop -c kind export logs --name wft "$RUNNER_TEMP/cluster-logs"
      - name: Upload cluster logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs
          path: ${{ runner.temp }}/cluster-logs
          if-no-files-found: ignore
      - run: nix develop -c just down
