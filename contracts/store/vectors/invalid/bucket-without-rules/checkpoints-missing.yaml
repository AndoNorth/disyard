---
detection_interval_minutes: 60
buckets:
  wft-sources:
    rules:
      - kind: abort-incomplete-multipart
        window: housekeeping.wft-sources.abort_incomplete_multipart_after_days
  wft-components:
    rules:
      - kind: abort-incomplete-multipart
        window: housekeeping.wft-components.abort_incomplete_multipart_after_days
  wft-results:
    rules:
      - kind: abort-incomplete-multipart
        window: housekeeping.wft-results.abort_incomplete_multipart_after_days
