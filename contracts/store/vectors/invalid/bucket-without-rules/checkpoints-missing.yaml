---
detection_interval_minutes: 60
buckets:
  dsy-sources:
    rules:
      - kind: abort-incomplete-multipart
        window: housekeeping.dsy-sources.abort_incomplete_multipart_after_days
  dsy-components:
    rules:
      - kind: abort-incomplete-multipart
        window: housekeeping.dsy-components.abort_incomplete_multipart_after_days
  dsy-results:
    rules:
      - kind: abort-incomplete-multipart
        window: housekeeping.dsy-results.abort_incomplete_multipart_after_days
