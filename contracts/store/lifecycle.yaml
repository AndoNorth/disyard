---
# Lifecycle rules per bucket. Schema: store.schema.json, generated from the models.
# A window names a key of contracts/state/retention.yaml, so the number lives in one place.
# Sources and components have no age rule, because their keys are content-addressed and shared across jobs.
detection_interval_minutes: 60
buckets:
  wft-sources:
    rules:
      - {kind: abort-incomplete-multipart, window: housekeeping.wft-sources.abort_incomplete_multipart_after_days}
  wft-components:
    rules:
      - {kind: abort-incomplete-multipart, window: housekeeping.wft-components.abort_incomplete_multipart_after_days}
  wft-results:
    rules:
      - {kind: abort-incomplete-multipart, window: housekeeping.wft-results.abort_incomplete_multipart_after_days}
      - {kind: expire, window: windows.wft-results.expire_after_days}
  wft-checkpoints:
    rules:
      - {kind: abort-incomplete-multipart, window: housekeeping.wft-checkpoints.abort_incomplete_multipart_after_days}
      - {kind: expire, window: windows.wft-checkpoints.expire_after_days}
