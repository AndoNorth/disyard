# The tenants, priority classes and caps of each preset. Rules: README.md. Schema: tenancy.schema.json.
# The dev and soak profiles use the ci figures, as the limits profiles do.
# A figure marked estimate: true changes by a value PR, and a tenant, a class or any other change is a
# contract-change PR.
tilt_profiles: {minimal: ci, ci: ci, dev: dev, full: dev, soak: soak}
profiles:
  ci: &figures
    priority_classes: [standard]
    reserve_interval: {value: 5, estimate: true}
    caps:
      open: {value: 2000, estimate: true}
      global: {value: 1000, estimate: true}
      job_class:
        short: {value: 1000, estimate: true}
        long: {value: 100, estimate: true}
    tenants:
      acme:
        quota: {value: 1000, estimate: true}
      e2e:
        quota: {value: 1000, estimate: true}
  dev: *figures
  soak: *figures
