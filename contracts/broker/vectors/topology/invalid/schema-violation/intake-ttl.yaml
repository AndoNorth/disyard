# The intake policy sets a message TTL.
vhost: /
intake_exchange: {name: wdf.intake, type: direct, durable: true}
intake_queue: {template: intake.<tenant>.<class>, type: quorum, initial_group_size: 1, binding: queue-name}
intake_policy:
  name: wdf-intake
  pattern: '^intake\.[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
  apply_to: quorum_queues
  definition:
    delivery_limit: 5
    max_length: {value: 1000, estimate: true}
    overflow: reject-publish
    dead_letter_exchange: wdf.dlx
    dead_letter_strategy: at-least-once
    message_ttl: 60000
dead_letter_exchange: {name: wdf.dlx, type: fanout, durable: true}
dead_letter_queue: {name: intake.dlq, type: quorum, initial_group_size: 1}
dlq_policy:
  name: wdf-dlq
  pattern: '^intake\.dlq$'
  apply_to: quorum_queues
  # -1 turns the delivery limit off, and no message TTL is set, so a dead letter leaves only by replay or purge.
  definition: {delivery_limit: -1}
addresses:
  publish: /exchanges/wdf.intake/<routing key>
  consume: /queues/<queue>
message:
  sections: [data]
  content_type: application/cloudevents+json; charset=utf-8
  durable: true
  application_properties: false
  annotations_on_publish: false
annotations:
  reason: x-opt-wdf-reason
  detail: x-opt-wdf-detail
  detail_max_chars: 1024
# Each permission is a RabbitMQ regular expression on vhost /, and the empty string grants nothing.
users:
  dispatch: {configure: '', write: '^wdf\.intake$', read: ''}
  admission: {configure: '', write: '', read: '^intake\.[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'}
  operator:
    configure: ''
    write: '^wdf\.intake$'
    read: '^intake\.dlq$|^intake\.[a-z0-9][a-z0-9-]*\.[a-z0-9][a-z0-9-]*$'
ports: {amqp: 5672, prometheus: 15692}
