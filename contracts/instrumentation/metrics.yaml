---
# Metrics defined by the event contract and the broker contract. Rules: README.md. Schema: metrics.schema.json.
metrics:
  wft_event_bytes:
    type: histogram
    unit: bytes
    help: Size of a serialised event.
    buckets: [256, 1024, 2048, 4096, 16384, 65536]
    labels: {}
  wft_event_size_warnings_total:
    type: counter
    help: Events serialised above the warning size.
    labels: {}
  wft_event_rejected_total:
    type: counter
    help: Events refused by the serializer, by the kind of failure.
    labels:
      reason:
        values: [schema-invalid, unsupported-major, event-too-large]
  wft_event_upgraded_total:
    type: counter
    help: Events read or replayed after an upgrade from the previous major.
    labels:
      type:
        values_from: contracts/events/schemas
      from_major:
        values: ["1"]
  wft_broker_publish_total:
    type: counter
    help: Publishes of the broker client to the intake exchange, by outcome.
    labels:
      outcome:
        values: [accepted, rejected, unroutable, timeout, unavailable, topology-error]
  wft_broker_settle_total:
    type: counter
    help: Settle calls of the broker client on an intake delivery, by call.
    labels:
      call:
        values: [ack, retry, dead_letter, release]
  wft_broker_dead_letter_total:
    type: counter
    help: Intake deliveries the consumer dead-lettered, by application reason of contracts/broker/reasons.yaml.
    labels:
      reason:
        values: [MALFORMED, UNSUPPORTED_VERSION, ADMISSION_FAILED]
