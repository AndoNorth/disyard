# yamllint disable rule:line-length
# Throwaway manifests of the whole observability stack at the limits of D9, applied by kubectl to the obs node.
# Requests equal limits, strategy Recreate, data on local-path volumes, as the epic's D9, D10 and D11 say.
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: dsy-obs}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-state-metrics, namespace: dsy-obs}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: collector, namespace: dsy-obs}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: s13-prometheus}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, pods, services, endpoints]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: s13-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: s13-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: dsy-obs}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: s13-kube-state-metrics}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, resourcequotas, persistentvolumeclaims, persistentvolumes, services, endpoints, configmaps, secrets, limitranges, replicationcontrollers]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: s13-kube-state-metrics}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: s13-kube-state-metrics}
subjects: [{kind: ServiceAccount, name: kube-state-metrics, namespace: dsy-obs}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: s13-collector}
rules:
  - apiGroups: [""]
    resources: [events, namespaces, pods]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: s13-collector}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: s13-collector}
subjects: [{kind: ServiceAccount, name: collector, namespace: dsy-obs}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: dsy-obs}
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs: [{role: pod}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape, __meta_kubernetes_pod_container_port_name]
            regex: 'true;.*|.*;(metrics|prometheus)'
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape, __meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            regex: 'true;(\d+);(.+)'
            target_label: __address__
            replacement: '$2:$1'
          - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - job_name: rabbitmq-detailed
        metrics_path: /metrics/detailed
        params: {family: [queue_coarse_metrics, queue_consumer_count]}
        kubernetes_sd_configs: [{role: pod, namespaces: {names: [dsy-infra]}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_container_port_number], regex: '15692', action: keep}
      - job_name: kubelet
        scheme: https
        authorization: {credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
        tls_config: {insecure_skip_verify: true}
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_node_address_InternalIP], regex: '(.+)', target_label: __address__, replacement: '$1:10250'}
          - {source_labels: [__meta_kubernetes_node_name], target_label: node}
      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization: {credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token}
        tls_config: {insecure_skip_verify: true}
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_node_address_InternalIP], regex: '(.+)', target_label: __address__, replacement: '$1:10250'}
          - {source_labels: [__meta_kubernetes_node_name], target_label: node}
      - job_name: prometheus
        static_configs: [{targets: ['localhost:9090']}]
      - job_name: kube-state-metrics
        static_configs: [{targets: ['kube-state-metrics.dsy-obs:8080']}]
      - job_name: loki
        static_configs: [{targets: ['loki.dsy-obs:3100']}]
      - job_name: tempo
        static_configs: [{targets: ['tempo.dsy-obs:3200']}]
      - job_name: pyroscope
        static_configs: [{targets: ['pyroscope.dsy-obs:4040']}]
      - job_name: grafana
        static_configs: [{targets: ['grafana.dsy-obs:3000']}]
      - job_name: collector
        static_configs: [{targets: ['collector.dsy-obs:8888']}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prometheus, namespace: dsy-obs}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: dsy-obs}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus, app.kubernetes.io/name: prometheus}}
    spec:
      serviceAccountName: prometheus
      nodeSelector: {dsy.dev/pool: obs}
      tolerations: [{key: dsy.dev/pool, operator: Equal, value: obs, effect: NoSchedule}]
      securityContext: {runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=10d
            - --storage.tsdb.retention.size=4GB
            - --web.enable-otlp-receiver
            - --web.listen-address=:9090
          ports: [{name: http, containerPort: 9090}]
          resources: {requests: {cpu: 100m, memory: 640Mi}, limits: {cpu: 100m, memory: 640Mi}}
          volumeMounts: [{name: config, mountPath: /etc/prometheus}, {name: data, mountPath: /prometheus}]
      volumes:
        - {name: config, configMap: {name: prometheus}}
        - {name: data, persistentVolumeClaim: {claimName: prometheus}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: dsy-obs}
spec: {selector: {app: prometheus}, ports: [{name: http, port: 9090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: dsy-obs}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      serviceAccountName: kube-state-metrics
      nodeSelector: {dsy.dev/pool: obs}
      tolerations: [{key: dsy.dev/pool, operator: Equal, value: obs, effect: NoSchedule}]
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          ports: [{name: http, containerPort: 8080}]
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {cpu: 20m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: dsy-obs}
spec: {selector: {app: kube-state-metrics}, ports: [{name: http, port: 8080}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: loki, namespace: dsy-obs}
data:
  loki.yaml: |
    auth_enabled: false
    server: {http_listen_port: 3100, grpc_listen_port: 9096}
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage: {filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}}
      replication_factor: 1
      ring: {kvstore: {store: inmemory}}
    schema_config:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    limits_config:
      retention_period: 240h
      allow_structured_metadata: true
      volume_enabled: true
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    analytics: {reporting_enabled: false}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: loki, namespace: dsy-obs}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: dsy-obs}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      nodeSelector: {dsy.dev/pool: obs}
      tolerations: [{key: dsy.dev/pool, operator: Equal, value: obs, effect: NoSchedule}]
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: loki
          image: grafana/loki:3.7.10
          args: [-config.file=/etc/loki/loki.yaml]
          ports: [{name: http, containerPort: 3100}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 100m, memory: 256Mi}}
          volumeMounts: [{name: config, mountPath: /etc/loki}, {name: data, mountPath: /loki}]
      volumes:
        - {name: config, configMap: {name: loki}}
        - {name: data, persistentVolumeClaim: {claimName: loki}}
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: dsy-obs}
spec: {selector: {app: loki}, ports: [{name: http, port: 3100}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: tempo, namespace: dsy-obs}
data:
  tempo.yaml: |
    server: {http_listen_port: 3200}
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: {endpoint: "0.0.0.0:4317"}
            http: {endpoint: "0.0.0.0:4318"}
    storage:
      trace:
        backend: local
        wal: {path: /var/tempo/wal}
        local: {path: /var/tempo/blocks}
    compactor:
      compaction: {block_retention: 72h}
    usage_report: {reporting_enabled: false}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: tempo, namespace: dsy-obs}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 4Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tempo, namespace: dsy-obs}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: tempo}}
  template:
    metadata: {labels: {app: tempo}}
    spec:
      nodeSelector: {dsy.dev/pool: obs}
      tolerations: [{key: dsy.dev/pool, operator: Equal, value: obs, effect: NoSchedule}]
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: tempo
          image: grafana/tempo:2.10.10
          args: [-config.file=/etc/tempo/tempo.yaml]
          ports: [{name: http, containerPort: 3200}, {name: otlp-grpc, containerPort: 4317}]
          resources: {requests: {cpu: 200m, memory: 1024Mi}, limits: {cpu: 200m, memory: 1024Mi}}
          volumeMounts: [{name: config, mountPath: /etc/tempo}, {name: data, mountPath: /var/tempo}]
      volumes:
        - {name: config, configMap: {name: tempo}}
        - {name: data, persistentVolumeClaim: {claimName: tempo}}
---
apiVersion: v1
kind: Service
metadata: {name: tempo, namespace: dsy-obs}
spec: {selector: {app: tempo}, ports: [{name: http, port: 3200}, {name: otlp-grpc, port: 4317}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: pyroscope, namespace: dsy-obs}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 4Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pyroscope, namespace: dsy-obs}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: pyroscope}}
  template:
    metadata: {labels: {app: pyroscope, app.kubernetes.io/name: pyroscope}}
    spec:
      nodeSelector: {dsy.dev/pool: obs}
      tolerations: [{key: dsy.dev/pool, operator: Equal, value: obs, effect: NoSchedule}]
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: pyroscope
          image: grafana/pyroscope:2.4.4
          args:
            - -target=all
            - -retention-period=72h
            - -pyroscopedb.data-path=/data
            - -storage.filesystem.dir=/data/v2/shared
          ports: [{name: http, containerPort: 4040}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 100m, memory: 256Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: pyroscope}}
---
apiVersion: v1
kind: Service
metadata: {name: pyroscope, namespace: dsy-obs}
spec: {selector: {app: pyroscope}, ports: [{name: http, port: 4040}]}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: collector, namespace: dsy-obs}
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: "0.0.0.0:4317"}
          http: {endpoint: "0.0.0.0:4318"}
      k8sobjects:
        objects:
          - {name: events, mode: watch, group: events.k8s.io}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 100, spike_limit_mib: 20}
      batch: {}
    exporters:
      otlphttp/loki: {endpoint: "http://loki.dsy-obs:3100/otlp"}
      otlp/tempo: {endpoint: "tempo.dsy-obs:4317", tls: {insecure: true}}
    service:
      telemetry:
        metrics: {readers: [{pull: {exporter: {prometheus: {host: 0.0.0.0, port: 8888}}}}]}
      pipelines:
        logs: {receivers: [otlp, k8sobjects], processors: [memory_limiter, batch], exporters: [otlphttp/loki]}
        traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/tempo]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: collector, namespace: dsy-obs}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: collector}}
  template:
    metadata: {labels: {app: collector, app.kubernetes.io/name: collector}}
    spec:
      serviceAccountName: collector
      nodeSelector: {dsy.dev/pool: obs}
      tolerations: [{key: dsy.dev/pool, operator: Equal, value: obs, effect: NoSchedule}]
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.165.0
          args: [--config=/etc/otelcol/collector.yaml]
          ports: [{name: otlp-http, containerPort: 4318}, {name: otlp-grpc, containerPort: 4317}, {name: metrics, containerPort: 8888}]
          resources: {requests: {cpu: 50m, memory: 160Mi}, limits: {cpu: 50m, memory: 160Mi}}
          volumeMounts: [{name: config, mountPath: /etc/otelcol}]
      volumes:
        - {name: config, configMap: {name: collector}}
---
apiVersion: v1
kind: Service
metadata: {name: collector, namespace: dsy-obs}
spec: {selector: {app: collector}, ports: [{name: otlp-http, port: 4318}, {name: otlp-grpc, port: 4317}, {name: metrics, port: 8888}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: state-inputs, namespace: dsy-obs}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: state-inputs}}
  template:
    metadata: {labels: {app: state-inputs}}
    spec:
      nodeSelector: {dsy.dev/pool: obs}
      tolerations: [{key: dsy.dev/pool, operator: Equal, value: obs, effect: NoSchedule}]
      containers:
        - name: state-inputs
          image: localhost:5001/s13-exporter:1
          envFrom: [{secretRef: {name: state-inputs-login}}]
          ports: [{name: metrics, containerPort: 9464}]
          resources: {requests: {cpu: 20m, memory: 96Mi}, limits: {cpu: 20m, memory: 96Mi}}
