# Accepted vulnerabilities. Every entry needs a statement saying why it cannot be fixed now and an expired_at date,
# after which the finding fails the scan again. Most entries come from the python base image the services build on.
vulnerabilities:
  - id: CVE-2025-47273
    statement: >-
      Listed by vendor.txt of the pip in the python base image, which no service runs. The newest
      python:3.13-slim-trixie still vendors it. Bump the base in deploy/versions.yaml once pip vendors the
      fix, then drop the entry.
    expired_at: 2027-01-15
  - id: CVE-2025-69720
    statement: >-
      No fixed Debian package exists yet. The package comes from the python base image, and the service
      does not run the affected tool or code path. Recheck on the next base image bump and drop the entry
      once Debian ships a fix.
    expired_at: 2027-02-15
