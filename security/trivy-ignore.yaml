  - id: GHSA-hq85-5cpj-mr62
    statement: >-
      Bundled CA store of the uv wheel in the compile image. uv is pinned to the dev shell's version in uv.lock, so a
      fix needs a nixpkgs update that carries uv 0.13.4. The compile image runs uv with no network. Bump the dev
      shell and uv.lock together, then drop the entry.
    expired_at: 2027-01-15
  - id: GHSA-4w2j-m93h-cj5j
    statement: >-
      quinn-proto inside the uv binary of the compile image. uv is a client that never serves QUIC streams, and it
      is pinned to the dev shell's version, so the fix comes with the same uv bump as GHSA-hq85-5cpj-mr62.
    expired_at: 2027-01-15
