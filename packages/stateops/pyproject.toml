[project]
name = "dsy-stateops"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pydantic",
    "pyyaml",
    "dsy-events",
    "dsy-eventstore",
    "dsy-jobstate",
    "dsy-keys",
    "dsy-migrate",
    "dsy-storecheck",
]

[project.entry-points."dsy.migrations"]
stateops = "dsy_stateops.migrations"

[tool.uv.sources]
dsy-events = { workspace = true }
dsy-eventstore = { workspace = true }
dsy-jobstate = { workspace = true }
dsy-keys = { workspace = true }
dsy-migrate = { workspace = true }
dsy-storecheck = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
