[project]
name = "wft-stateops"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pydantic",
    "pyyaml",
    "wft-events",
    "wft-eventstore",
    "wft-jobstate",
    "wft-keys",
    "wft-migrate",
    "wft-storecheck",
]

[project.entry-points."wft.migrations"]
stateops = "wft_stateops.migrations"

[tool.uv.sources]
wft-events = { workspace = true }
wft-eventstore = { workspace = true }
wft-jobstate = { workspace = true }
wft-keys = { workspace = true }
wft-migrate = { workspace = true }
wft-storecheck = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
