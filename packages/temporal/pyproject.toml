[project]
name = "wft-temporal"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["opentelemetry-api", "opentelemetry-sdk", "pyyaml", "temporalio", "wft-events", "wft-itest", "wft-keys"]

[tool.uv.sources]
wft-events = { workspace = true }
wft-itest = { workspace = true }
wft-keys = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
