[project]
name = "wft-artifactreaper"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pyyaml",
    "temporalio",
    "wft-artifactclient",
    "wft-artifactindex",
    "wft-storecheck",
]

[tool.uv.sources]
wft-artifactclient = { workspace = true }
wft-artifactindex = { workspace = true }
wft-storecheck = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
