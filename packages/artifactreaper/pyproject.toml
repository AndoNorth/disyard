[project]
name = "dsy-artifactreaper"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pyyaml",
    "temporalio",
    "dsy-artifactclient",
    "dsy-artifactindex",
    "dsy-servicekit",
    "dsy-storecheck",
    "dsy-temporal",
]

[tool.uv.sources]
dsy-artifactclient = { workspace = true }
dsy-artifactindex = { workspace = true }
dsy-servicekit = { workspace = true }
dsy-storecheck = { workspace = true }
dsy-temporal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
