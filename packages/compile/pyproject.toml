[project]
name = "dsy-compile"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["componentize-py==0.25.1", "dsy-jobcheck", "dsy-keys", "dsy-runtime"]

[tool.uv.sources]
