[project]
name = "wft-runtime"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic", "pyyaml", "wft-jobdoc", "wft-kernel", "wft-keys"]

[tool.uv.sources]
wft-jobdoc = { workspace = true }
wft-kernel = { workspace = true }
wft-keys = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
