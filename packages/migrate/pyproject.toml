[project]
name = "wft-migrate"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["psycopg[binary]", "pytest", "wft-itest"]

[project.entry-points.pytest11]
wft_migrate = "wft_migrate.fixtures"

[tool.uv.sources]
wft-itest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
