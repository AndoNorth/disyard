[project]
name = "wft-jobstate"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["psycopg[binary]", "pydantic", "pyyaml", "wft-events"]

[project.entry-points."wft.migrations"]
jobstate = "wft_jobstate.migrations"

[tool.uv.sources]
wft-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
