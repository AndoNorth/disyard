[project]
name = "dsy-broker"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic",
    "python-qpid-proton==0.40.0",
    "pyyaml",
    "dsy-compat",
    "dsy-events",
    "dsy-itest",
    "dsy-jobdoc",
]

[tool.uv.sources]
dsy-compat = { workspace = true }
dsy-events = { workspace = true }
dsy-itest = { workspace = true }
dsy-jobdoc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
