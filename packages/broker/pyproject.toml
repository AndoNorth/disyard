[project]
name = "wdf-broker"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic",
    "python-qpid-proton==0.40.0",
    "pyyaml",
    "wdf-compat",
    "wdf-events",
    "wdf-itest",
    "wdf-jobdoc",
]

[tool.uv.sources]
wdf-compat = { workspace = true }
wdf-events = { workspace = true }
wdf-itest = { workspace = true }
wdf-jobdoc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
