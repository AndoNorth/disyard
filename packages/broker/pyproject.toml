[project]
name = "wft-broker"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic",
    "python-qpid-proton==0.40.0",
    "pyyaml",
    "wft-compat",
    "wft-events",
    "wft-itest",
    "wft-jobdoc",
]

[tool.uv.sources]
wft-compat = { workspace = true }
wft-events = { workspace = true }
wft-itest = { workspace = true }
wft-jobdoc = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
