[project]
name = "wft-aggregate"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "wft-artifactclient",
    "wft-kernel",
    "wft-storecheck",
]

[tool.uv.sources]
wft-artifactclient = { workspace = true }
wft-kernel = { workspace = true }
wft-storecheck = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
