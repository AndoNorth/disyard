[project]
name = "wft-admission"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pydantic",
    "temporalio",
    "wft-broker",
    "wft-compat",
    "wft-events",
    "wft-eventstore",
    "wft-jobstate",
    "wft-keys",
    "wft-obs",
    "wft-stages",
    "wft-temporal",
    "wft-workflow",
]

# The drivers of a deployed cluster, which no image runs.
[project.optional-dependencies]
cluster = ["wft-clusterkit"]

[tool.uv.sources]
wft-broker = { workspace = true }
wft-clusterkit = { workspace = true }
wft-compat = { workspace = true }
wft-events = { workspace = true }
wft-eventstore = { workspace = true }
wft-jobstate = { workspace = true }
wft-keys = { workspace = true }
wft-obs = { workspace = true }
wft-stages = { workspace = true }
wft-temporal = { workspace = true }
wft-workflow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
