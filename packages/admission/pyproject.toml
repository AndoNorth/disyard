[project]
name = "wdf-admission"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pydantic",
    "temporalio",
    "wdf-broker",
    "wdf-compat",
    "wdf-events",
    "wdf-eventstore",
    "wdf-jobstate",
    "wdf-keys",
    "wdf-stages",
    "wdf-temporal",
    "wdf-workflow",
]

[tool.uv.sources]
wdf-broker = { workspace = true }
wdf-compat = { workspace = true }
wdf-events = { workspace = true }
wdf-eventstore = { workspace = true }
wdf-jobstate = { workspace = true }
wdf-keys = { workspace = true }
wdf-stages = { workspace = true }
wdf-temporal = { workspace = true }
wdf-workflow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
