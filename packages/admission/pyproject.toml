[project]
name = "dsy-admission"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pydantic",
    "temporalio",
    "dsy-broker",
    "dsy-compat",
    "dsy-events",
    "dsy-eventstore",
    "dsy-jobstate",
    "dsy-keys",
    "dsy-obs",
    "dsy-stages",
    "dsy-temporal",
    "dsy-workflow",
]

# The drivers of a deployed cluster, which no image runs.
[project.optional-dependencies]
cluster = ["dsy-clusterkit"]

[tool.uv.sources]
dsy-broker = { workspace = true }
dsy-clusterkit = { workspace = true }
dsy-compat = { workspace = true }
dsy-events = { workspace = true }
dsy-eventstore = { workspace = true }
dsy-jobstate = { workspace = true }
dsy-keys = { workspace = true }
dsy-obs = { workspace = true }
dsy-stages = { workspace = true }
dsy-temporal = { workspace = true }
dsy-workflow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
