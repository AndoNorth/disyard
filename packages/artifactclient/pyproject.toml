[project]
name = "wft-artifactclient"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3",
    "pydantic",
    "pytest",
    "pyyaml",
    "wft-artifactindex",
    "wft-compat",
    "wft-events",
    "wft-storecheck",
]

[project.entry-points.pytest11]
wft_artifactclient = "wft_artifactclient.testing"

[tool.uv.sources]
wft-artifactindex = { workspace = true }
wft-compat = { workspace = true }
wft-events = { workspace = true }
wft-storecheck = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
