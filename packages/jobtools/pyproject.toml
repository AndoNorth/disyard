[project]
name = "wft-jobtools"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["wft-jobdoc", "wft-jobcheck", "wft-plan", "wft-jobpatch", "wft-jobexamples"]

[tool.uv.sources]
wft-jobdoc = { workspace = true }
wft-jobcheck = { workspace = true }
wft-plan = { workspace = true }
wft-jobpatch = { workspace = true }
wft-jobexamples = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
