[project]
name = "wdf-worker"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "temporalio",
    "wdf-artifactclient",
    "wdf-events",
    "wdf-keys",
    "wdf-stages",
    "wdf-temporal",
    "wdf-workflow",
]

# One extra per pool image: the library its child processes run, and the binary it needs on PATH.
[project.optional-dependencies]
compile = ["uv==0.11.21", "wdf-compile"]
simulate = ["wdf-runtime"]
aggregate = ["wdf-aggregate"]

[tool.uv.sources]
wdf-aggregate = { workspace = true }
wdf-artifactclient = { workspace = true }
wdf-compile = { workspace = true }
wdf-events = { workspace = true }
wdf-keys = { workspace = true }
wdf-runtime = { workspace = true }
wdf-stages = { workspace = true }
wdf-temporal = { workspace = true }
wdf-workflow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
