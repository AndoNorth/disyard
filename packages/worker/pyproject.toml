[project]
name = "wft-worker"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "temporalio",
    "wft-artifactclient",
    "wft-events",
    "wft-keys",
    "wft-obs",
    "wft-stages",
    "wft-temporal",
    "wft-workflow",
]

# One extra per pool image: the library its child processes run, and the binary it needs on PATH.
[project.optional-dependencies]
compile = ["uv==0.11.21", "wft-compile"]
simulate = ["wft-runtime"]
aggregate = ["wft-aggregate"]

[tool.uv.sources]
wft-aggregate = { workspace = true }
wft-artifactclient = { workspace = true }
wft-compile = { workspace = true }
wft-events = { workspace = true }
wft-keys = { workspace = true }
wft-obs = { workspace = true }
wft-runtime = { workspace = true }
wft-stages = { workspace = true }
wft-temporal = { workspace = true }
wft-workflow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
