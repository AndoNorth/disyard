[project]
name = "dsy-eventstore"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic", "pyyaml", "dsy-compat", "dsy-events"]

[project.entry-points."dsy.migrations"]
eventstore = "dsy_eventstore.migrations"

[tool.uv.sources]
dsy-compat = { workspace = true }
dsy-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
