[project]
name = "wft-eventstore"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic", "pyyaml", "wft-compat", "wft-events"]

[project.entry-points."wft.migrations"]
eventstore = "wft_eventstore.migrations"

[tool.uv.sources]
wft-compat = { workspace = true }
wft-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
