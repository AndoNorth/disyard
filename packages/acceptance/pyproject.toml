[project]
name = "wft-acceptance"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
# Every dependency the clients and the gate import, declared here so the wheel test catches an undeclared one.
dependencies = [
    "temporalio",
    "wft-broker",
    "wft-clusterkit",
    "wft-kernel",
    "wft-obs",
    "wft-workflow",
    "wft-workloads",
]

[tool.uv.sources]
wft-broker = { workspace = true }
wft-clusterkit = { workspace = true }
wft-kernel = { workspace = true }
wft-obs = { workspace = true }
wft-workflow = { workspace = true }
wft-workloads = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
