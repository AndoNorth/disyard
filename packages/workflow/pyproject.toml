[project]
name = "dsy-workflow"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pydantic",
    "pyyaml",
    "temporalio",
    "dsy-artifactclient",
    "dsy-artifactindex",
    "dsy-artifactreaper",
    "dsy-compat",
    "dsy-compile",
    "dsy-events",
    "dsy-eventstore",
    "dsy-itest",
    "dsy-jobdoc",
    "dsy-jobpatch",
    "dsy-jobstate",
    "dsy-keys",
    "dsy-obs",
    "dsy-plan",
    "dsy-runtime",
    "dsy-servicekit",
    "dsy-stages",
    "dsy-temporal",
]

# The drivers of a deployed cluster, which no image runs.
[project.optional-dependencies]
cluster = ["dsy-clusterkit"]

[tool.uv.sources]
dsy-artifactclient = { workspace = true }
dsy-artifactindex = { workspace = true }
dsy-artifactreaper = { workspace = true }
dsy-clusterkit = { workspace = true }
dsy-compat = { workspace = true }
dsy-compile = { workspace = true }
dsy-events = { workspace = true }
dsy-eventstore = { workspace = true }
dsy-itest = { workspace = true }
dsy-jobdoc = { workspace = true }
dsy-jobpatch = { workspace = true }
dsy-jobstate = { workspace = true }
dsy-keys = { workspace = true }
dsy-obs = { workspace = true }
dsy-plan = { workspace = true }
dsy-runtime = { workspace = true }
dsy-servicekit = { workspace = true }
dsy-stages = { workspace = true }
dsy-temporal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
