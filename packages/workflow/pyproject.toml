[project]
name = "wft-workflow"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "psycopg[binary]",
    "pydantic",
    "pyyaml",
    "temporalio",
    "wft-artifactclient",
    "wft-artifactindex",
    "wft-artifactreaper",
    "wft-compat",
    "wft-compile",
    "wft-events",
    "wft-eventstore",
    "wft-itest",
    "wft-jobdoc",
    "wft-jobpatch",
    "wft-jobstate",
    "wft-keys",
    "wft-obs",
    "wft-plan",
    "wft-runtime",
    "wft-stages",
    "wft-temporal",
]

# The drivers of a deployed cluster, which no image runs.
[project.optional-dependencies]
cluster = ["wft-clusterkit"]

[tool.uv.sources]
wft-artifactclient = { workspace = true }
wft-artifactindex = { workspace = true }
wft-artifactreaper = { workspace = true }
wft-clusterkit = { workspace = true }
wft-compat = { workspace = true }
wft-compile = { workspace = true }
wft-events = { workspace = true }
wft-eventstore = { workspace = true }
wft-itest = { workspace = true }
wft-jobdoc = { workspace = true }
wft-jobpatch = { workspace = true }
wft-jobstate = { workspace = true }
wft-keys = { workspace = true }
wft-obs = { workspace = true }
wft-plan = { workspace = true }
wft-runtime = { workspace = true }
wft-stages = { workspace = true }
wft-temporal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
